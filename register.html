<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สมัครสมาชิก | Hotel Work Management System</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<script>(function(){var t=localStorage.getItem("hwms_theme");if(t==="dark")document.documentElement.setAttribute("data-theme","dark");})();</script>
</head>
<body>

<div class="hwms-login-wrap">
  <button onclick="(function(){var h=document.documentElement;var d=h.getAttribute('data-theme')==='dark';if(d){h.removeAttribute('data-theme');localStorage.setItem('hwms_theme','light');}else{h.setAttribute('data-theme','dark');localStorage.setItem('hwms_theme','dark');}document.getElementById('registerThemeIcon').className='fa-solid '+(d?'fa-moon':'fa-sun');})()" class="hwms-icon-btn" style="position:fixed; top:20px; right:20px;" aria-label="สลับโหมดกลางวัน/กลางคืน">
    <i class="fa-solid fa-moon" id="registerThemeIcon"></i>
  </button>
  <div class="hwms-login-card hwms-fade-in" style="max-width:460px;">
    <div class="text-center">
      <div class="hwms-login-logo"><i class="fa-solid fa-user-plus"></i></div>
      <h1 style="font-size:20px; margin-bottom:2px;">สมัครสมาชิกใหม่</h1>
      <p class="text-muted" style="font-size:13px;">
        สมัครในฐานะ "พนักงานทั่วไป (Staff)" — บัญชีของคุณต้องรอผู้ดูแลระบบอนุมัติก่อนจึงจะเข้าใช้งานได้
      </p>
    </div>

    <form id="registerForm" class="mt-4" novalidate>
      <div class="mb-3">
        <label class="hwms-label" for="fullName">ชื่อ-นามสกุล</label>
        <input type="text" class="form-control hwms-input" id="fullName" placeholder="เช่น สมชาย ใจดี" required>
      </div>

      <div class="mb-3">
        <label class="hwms-label" for="username">ชื่อผู้ใช้งาน</label>
        <input type="text" class="form-control hwms-input" id="username" placeholder="ใช้ตัวอักษร a-z, ตัวเลข, . _ - เท่านั้น" required>
        <div class="form-text" style="font-size:11px;">ห้ามเว้นวรรคหรือใช้ตัวอักษรพิเศษอื่น (3-50 ตัวอักษร)</div>
      </div>

      <div class="mb-3">
        <label class="hwms-label" for="department">แผนก</label>
        <select class="form-select hwms-input" id="department" required>
          <option value="">เลือกแผนก</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="hwms-label" for="password">รหัสผ่าน</label>
        <input type="password" class="form-control hwms-input" id="password" placeholder="อย่างน้อย 6 ตัวอักษร" minlength="6" required>
      </div>

      <div class="mb-4">
        <label class="hwms-label" for="confirmPassword">ยืนยันรหัสผ่าน</label>
        <input type="password" class="form-control hwms-input" id="confirmPassword" placeholder="กรอกรหัสผ่านอีกครั้ง" minlength="6" required>
      </div>

      <button type="submit" class="btn btn-hwms-primary w-100 py-2" id="registerBtn">
        <span id="registerBtnText">สมัครสมาชิก</span>
      </button>

      <div class="text-center mt-3" style="font-size:13px;">
        มีบัญชีอยู่แล้ว? <a href="login.html" style="font-weight:700;">เข้าสู่ระบบ</a>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script>
  // ตั้งไอคอนปุ่ม dark mode ให้ตรงกับธีมปัจจุบันตอนโหลดหน้า
  if (document.documentElement.getAttribute("data-theme") === "dark") {
    document.getElementById("registerThemeIcon").className = "fa-solid fa-sun";
  }

  // เติมตัวเลือกแผนกในฟอร์ม (อ่านได้แม้ยังไม่ login เพราะเป็นข้อมูลสาธารณะ)
  (async function loadDepartments() {
    const { data, error } = await supabaseClient.from("departments").select("*").order("id");
    const select = document.getElementById("department");
    if (error || !data) {
      select.innerHTML = '<option value="">ไม่สามารถโหลดรายชื่อแผนกได้</option>';
      return;
    }
    data.forEach(d => {
      const opt = document.createElement("option");
      opt.value = d.id;
      opt.textContent = d.name_th;
      select.appendChild(opt);
    });
  })();

  document.getElementById("registerForm").addEventListener("submit", async function (e) {
    e.preventDefault();

    const fullName = document.getElementById("fullName").value.trim();
    const username = document.getElementById("username").value.trim();
    const departmentId = document.getElementById("department").value;
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;
    const btn = document.getElementById("registerBtn");
    const btnText = document.getElementById("registerBtnText");

    if (!fullName || !username || !departmentId || !password || !confirmPassword) {
      Swal.fire({ icon: "warning", title: "กรอกข้อมูลไม่ครบ", text: "กรุณากรอกข้อมูลให้ครบทุกช่อง", confirmButtonColor: "#2563EB" });
      return;
    }
    if (!/^[a-zA-Z0-9._-]{3,50}$/.test(username)) {
      Swal.fire({ icon: "warning", title: "ชื่อผู้ใช้งานไม่ถูกต้อง", text: "ใช้ได้เฉพาะ a-z, 0-9, . _ - เท่านั้น (3-50 ตัวอักษร)", confirmButtonColor: "#2563EB" });
      return;
    }
    if (password.length < 6) {
      Swal.fire({ icon: "warning", title: "รหัสผ่านสั้นเกินไป", text: "รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร", confirmButtonColor: "#2563EB" });
      return;
    }
    if (password !== confirmPassword) {
      Swal.fire({ icon: "warning", title: "รหัสผ่านไม่ตรงกัน", text: "กรุณากรอกรหัสผ่านทั้งสองช่องให้ตรงกัน", confirmButtonColor: "#2563EB" });
      return;
    }

    btn.disabled = true;
    btnText.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>กำลังสมัครสมาชิก...';

    try {
      await registerNewUser({ fullName, username, password, departmentId });
      Swal.fire({
        icon: "success",
        title: "สมัครสมาชิกสำเร็จ",
        text: "บัญชีของคุณถูกสร้างแล้ว กรุณารอผู้ดูแลระบบอนุมัติก่อนเข้าใช้งาน",
        confirmButtonText: "กลับไปหน้าเข้าสู่ระบบ",
        confirmButtonColor: "#2563EB"
      }).then(() => {
        window.location.href = "login.html";
      });
    } catch (err) {
      console.error(err);
      btn.disabled = false;
      btnText.textContent = "สมัครสมาชิก";

      let message = "เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง";
      if (err.message && err.message.includes("duplicate")) {
        message = "ชื่อผู้ใช้งานนี้มีอยู่ในระบบแล้ว กรุณาเลือกชื่ออื่น";
      } else if (err.message && err.message.toLowerCase().includes("already registered")) {
        message = "ชื่อผู้ใช้งานนี้มีอยู่ในระบบแล้ว กรุณาเลือกชื่ออื่น";
      }
      Swal.fire({ icon: "error", title: "สมัครสมาชิกไม่สำเร็จ", text: message, confirmButtonColor: "#EF4444" });
    }
  });
</script>
</body>
</html>
