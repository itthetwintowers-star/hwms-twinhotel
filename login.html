<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เข้าสู่ระบบ | Hotel Work Management System</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<script>(function(){var t=localStorage.getItem("hwms_theme");if(t==="dark")document.documentElement.setAttribute("data-theme","dark");})();</script>
</head>
<body>

<div class="hwms-login-wrap">
  <button onclick="(function(){var h=document.documentElement;var d=h.getAttribute('data-theme')==='dark';if(d){h.removeAttribute('data-theme');localStorage.setItem('hwms_theme','light');}else{h.setAttribute('data-theme','dark');localStorage.setItem('hwms_theme','dark');}document.getElementById('loginThemeIcon').className='fa-solid '+(d?'fa-moon':'fa-sun');})()" class="hwms-icon-btn" style="position:fixed; top:20px; right:20px;" aria-label="สลับโหมดกลางวัน/กลางคืน">
    <i class="fa-solid fa-moon" id="loginThemeIcon"></i>
  </button>
  <div class="hwms-login-card hwms-fade-in">
    <div class="text-center">
      <div class="hwms-login-logo"><i class="fa-solid fa-hotel"></i></div>
      <h1 style="font-size:20px; margin-bottom:2px;">Hotel Work Management System</h1>
      <p class="text-muted" style="font-size:13px;">เข้าสู่ระบบเพื่อจัดการงานแจ้งซ่อมและงานบริการโรงแรม</p>
    </div>

    <form id="loginForm" class="mt-4" novalidate>
      <div class="mb-3">
        <label class="hwms-label" for="username">ชื่อผู้ใช้งาน</label>
        <div class="position-relative">
          <input type="text" class="form-control hwms-input ps-5" id="username" placeholder="กรอกชื่อผู้ใช้งาน" autocomplete="username" required>
          <i class="fa-solid fa-user" style="position:absolute; left:14px; top:50%; transform:translateY(-50%); color:#94A3B8;"></i>
        </div>
      </div>

      <div class="mb-3">
        <label class="hwms-label" for="password">รหัสผ่าน</label>
        <div class="position-relative">
          <input type="password" class="form-control hwms-input ps-5" id="password" placeholder="กรอกรหัสผ่าน" autocomplete="current-password" required>
          <i class="fa-solid fa-lock" style="position:absolute; left:14px; top:50%; transform:translateY(-50%); color:#94A3B8;"></i>
          <button type="button" id="togglePassword" class="btn btn-sm" style="position:absolute; right:6px; top:50%; transform:translateY(-50%); color:#94A3B8;">
            <i class="fa-regular fa-eye"></i>
          </button>
        </div>
      </div>

      <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="rememberMe">
          <label class="form-check-label" for="rememberMe" style="font-size:13px;">จดจำฉันไว้</label>
        </div>
        <a href="#" id="forgotPasswordLink" style="font-size:13px; font-weight:600;">ลืมรหัสผ่าน?</a>
      </div>

      <button type="submit" class="btn btn-hwms-primary w-100 py-2" id="loginBtn">
        <span id="loginBtnText">เข้าสู่ระบบ</span>
      </button>

      <div class="text-center mt-3" style="font-size:12px; color:#94A3B8;">
        ยังไม่มีบัญชี? กรุณาติดต่อผู้ดูแลระบบเพื่อขอสร้างบัญชีให้
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/app.js"></script>
<script>
  // ตั้งไอคอนปุ่ม dark mode ให้ตรงกับธีมปัจจุบันตอนโหลดหน้า
  if (document.documentElement.getAttribute("data-theme") === "dark") {
    document.getElementById("loginThemeIcon").className = "fa-solid fa-sun";
  }

  // ถ้าล็อกอินอยู่แล้ว ให้ไปหน้า dashboard ทันที
  if (getCurrentUser()) {
    window.location.href = "dashboard.html";
  }

  // สลับการแสดง/ซ่อนรหัสผ่าน
  document.getElementById("togglePassword").addEventListener("click", function () {
    const pwd = document.getElementById("password");
    const icon = this.querySelector("i");
    if (pwd.type === "password") {
      pwd.type = "text";
      icon.classList.replace("fa-eye", "fa-eye-slash");
    } else {
      pwd.type = "password";
      icon.classList.replace("fa-eye-slash", "fa-eye");
    }
  });

  // ลืมรหัสผ่าน
  document.getElementById("forgotPasswordLink").addEventListener("click", function (e) {
    e.preventDefault();
    Swal.fire({
      title: "ลืมรหัสผ่าน?",
      text: "กรุณาติดต่อผู้ดูแลระบบเพื่อรีเซ็ตรหัสผ่านของคุณ",
      icon: "info",
      confirmButtonText: "รับทราบ",
      confirmButtonColor: "#2563EB"
    });
  });

  // จัดการการ submit form login (เรียก Supabase Auth จริง)
  document.getElementById("loginForm").addEventListener("submit", async function (e) {
    e.preventDefault();
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;
    const btn = document.getElementById("loginBtn");
    const btnText = document.getElementById("loginBtnText");

    if (!username || !password) {
      Swal.fire({ icon: "warning", title: "กรอกข้อมูลไม่ครบ", text: "กรุณากรอกชื่อผู้ใช้งานและรหัสผ่าน", confirmButtonColor: "#2563EB" });
      return;
    }

    btn.disabled = true;
    btnText.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>กำลังเข้าสู่ระบบ...';

    try {
      const result = await findUserByCredentials(username, password);

      if (result.status === "ok") {
        setCurrentUser(result.user);
        window.location.href = "dashboard.html";
        return;
      }

      btn.disabled = false;
      btnText.textContent = "เข้าสู่ระบบ";

      if (result.status === "pending") {
        Swal.fire({
          icon: "info",
          title: "บัญชีถูกปิดใช้งานอยู่",
          text: "บัญชีของคุณยังไม่ได้เปิดใช้งาน หรือถูกปิดใช้งานอยู่ กรุณาติดต่อผู้ดูแลระบบ",
          confirmButtonColor: "#2563EB"
        });
      } else {
        Swal.fire({
          icon: "error",
          title: "เข้าสู่ระบบไม่สำเร็จ",
          text: "ชื่อผู้ใช้งานหรือรหัสผ่านไม่ถูกต้อง",
          confirmButtonColor: "#EF4444"
        });
      }
    } catch (err) {
      console.error(err);
      btn.disabled = false;
      btnText.textContent = "เข้าสู่ระบบ";
      Swal.fire({
        icon: "error",
        title: "เกิดข้อผิดพลาด",
        text: "ไม่สามารถเชื่อมต่อระบบได้ กรุณาลองใหม่อีกครั้ง",
        confirmButtonColor: "#EF4444"
      });
    }
  });
</script>
</body>
</html>
