<!DOCTYPE html>
<html lang="th">
<head>

<title>Hotel Work Management System</title>
<link href="css/style.css" rel="stylesheet">
</head>
<body style="background:#F8FAFC;">

    <div class="hwms-spinner"></div>

    // จุดเริ่มต้นของระบบ: ตรวจสอบสถานะล็อกอินแล้ว redirect ไปหน้าที่เหมาะสม
    const user = sessionStorage.getItem("hwms_current_user");

  </script>
