<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>รายงาน | Hotel Work Management System</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<script>(function(){var t=localStorage.getItem("hwms_theme");if(t==="dark")document.documentElement.setAttribute("data-theme","dark");})();</script>
</head>
<body>

<div class="hwms-app" id="hwmsApp">
  <div id="sidebarContainer"></div>

  <div class="hwms-main">
    <div id="headerContainer"></div>

    <main class="hwms-content hwms-fade-in">
      <div class="d-flex justify-content-between align-items-end flex-wrap gap-2 mb-4">
        <div>
          <div class="hwms-page-title">รายงาน</div>
          <div class="hwms-page-subtitle">สรุปภาพรวมและสถิติการดำเนินงานทั้งหมด</div>
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-hwms-outline" id="exportExcelBtn"><i class="fa-solid fa-file-excel me-1" style="color:#22C55E;"></i> Export Excel</button>
          <button class="btn btn-hwms-outline" id="exportPdfBtn"><i class="fa-solid fa-file-pdf me-1" style="color:#EF4444;"></i> Export PDF</button>
        </div>
      </div>

      <!-- Filter -->
      <div class="hwms-card hwms-card-body mb-3">
        <div class="row g-2 align-items-end">
          <div class="col-6 col-md-3">
            <label class="hwms-label">เดือน</label>
            <select class="form-select hwms-input" id="reportMonth">
              <option value="">ทั้งหมด</option>
            </select>
          </div>
          <div class="col-6 col-md-3">
            <label class="hwms-label">ปี</label>
            <select class="form-select hwms-input" id="reportYear"></select>
          </div>
          <div class="col-6 col-md-3">
            <label class="hwms-label">แผนก</label>
            <select class="form-select hwms-input" id="reportDepartment">
              <option value="">ทั้งหมด</option>
            </select>
          </div>
          <div class="col-6 col-md-3">
            <label class="hwms-label">สถานะ</label>
            <select class="form-select hwms-input" id="reportStatus">
              <option value="">ทั้งหมด</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Summary Cards -->
      <div class="row g-3 mb-4" id="reportSummaryRow"></div>

      <!-- Charts -->
      <div class="row g-3 mb-4">
        <div class="col-lg-6">
          <div class="hwms-card hwms-card-body h-100">
            <h2 style="font-size:15px;" class="mb-3">สัดส่วนสถานะงาน</h2>
            <canvas id="reportStatusChart" height="240"></canvas>
          </div>
        </div>
        <div class="col-lg-6">
          <div class="hwms-card hwms-card-body h-100">
            <h2 style="font-size:15px;" class="mb-3">เปรียบเทียบงานตามแผนก</h2>
            <canvas id="reportDeptChart" height="240"></canvas>
          </div>
        </div>
      </div>

      <div class="row g-3 mb-4">
        <div class="col-12">
          <div class="hwms-card hwms-card-body">
            <h2 style="font-size:15px;" class="mb-3">แนวโน้มงานรายเดือน</h2>
            <canvas id="reportTrendChart" height="90"></canvas>
          </div>
        </div>
      </div>

      <!-- Summary table -->
      <div class="hwms-card">
        <div class="hwms-card-body pb-0">
          <h2 style="font-size:15px;">สรุปตามแผนก</h2>
        </div>
        <div class="hwms-scroll-x">
          <table class="table hwms-table mb-0">
            <thead>
              <tr>
                <th>แผนก</th>
                <th>งานทั้งหมด</th>
                <th>งานเสร็จสิ้น</th>
                <th>งานเกินกำหนด</th>
                <th>อัตราความสำเร็จ</th>
              </tr>
            </thead>
            <tbody id="reportTableBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/app.js"></script>
<script src="js/reports.js"></script>
</body>
</html>
